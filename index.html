<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      The tags below are a fallback for crawlers and social scrapers that read
      the raw response. Each prerendered page has these same values injected by
      react-helmet-async during scripts/prerender.mjs, and SEOMeta overwrites
      them at runtime, so there is exactly one of each in the served HTML.

      This exists because the previous index.html had a bare title element and
      nothing else: a crawler that did not run JavaScript saw a title with no
      brand suffix, no description, no canonical and no og:image.
    -->
    <title>Amin Garage | Car Repair in Faqir Wali, Bahawalnagar</title>
    <meta
      name="description"
      content="Amin Garage is an auto repair workshop in Faqir Wali, Bahawalnagar. Car denting and body repair, painting, mechanical and engine work, polishing, 15+ years. Call for a quote."
    />
    <link rel="canonical" href="https://amingarage.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Amin Garage" />
    <meta property="og:locale" content="en_PK" />
    <meta property="og:url" content="https://amingarage.com/" />
    <meta property="og:title" content="Amin Garage | Car Repair in Faqir Wali, Bahawalnagar" />
    <meta
      property="og:description"
      content="Amin Garage is an auto repair workshop in Faqir Wali, Bahawalnagar. Car denting and body repair, painting, mechanical and engine work, polishing, 15+ years. Call for a quote."
    />
      <meta property="og:image" content="https://amingarage.com/favicon.png" />
    <meta property="og:image:width" content="300" />
    <meta property="og:image:height" content="200" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://amingarage.com/" />
    <meta name="twitter:title" content="Amin Garage | Car Repair in Faqir Wali, Bahawalnagar" />
    <meta
      name="twitter:description"
      content="Amin Garage is an auto repair workshop in Faqir Wali, Bahawalnagar. Car denting and body repair, painting, mechanical and engine work, polishing, 15+ years. Call for a quote."
    />
    <meta name="twitter:image" content="https://amingarage.com/favicon.png" />

    <meta name="geo.region" content="PK-PB" />
    <meta name="geo.placename" content="Faqir Wali" />
    <meta name="ICBM" content="29.482791875211284, 73.0411948755323" />

    <meta name="theme-color" content="#dc2626" />

    <!-- Desktop + Mobile Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="icon" sizes="192x192" href="/favicon.png" />
  </head>

  <body>
    <!--
      Prerendered pages carry their full content inside #root, so a visitor with
      JavaScript disabled still sees the real page. No noscript fallback is
      needed for that reason.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
