<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Fallback head for crawlers that read the raw response. The prerenderer
      injects the route-specific values during scripts/prerender.mjs and SEOMeta
      keeps them in sync at runtime, so the served HTML has exactly one of each.
    -->
    <title>Amin Garage | Auto Repair & Car Painting in Faqir Wali</title>
    <meta
      name="description"
      content="Amin Garage is a trusted auto repair workshop in Faqir Wali offering car painting, denting, engine repair, mechanical work, detailing and spare parts."
    />
    <link rel="canonical" href="https://amingarage.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Amin Garage" />
    <meta property="og:locale" content="en_PK" />
    <meta property="og:url" content="https://amingarage.com/" />
    <meta
      property="og:title"
      content="Amin Garage | Auto Repair & Car Painting in Faqir Wali"
    />
    <meta
      property="og:description"
      content="Amin Garage is a trusted auto repair workshop in Faqir Wali offering car painting, denting, engine repair, mechanical work, detailing and spare parts."
    />
    <meta property="og:image" content="https://amingarage.com/favicon.png" />
    <meta property="og:image:width" content="300" />
    <meta property="og:image:height" content="200" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://amingarage.com/" />
    <meta
      name="twitter:title"
      content="Amin Garage | Auto Repair & Car Painting in Faqir Wali"
    />
    <meta
      name="twitter:description"
      content="Amin Garage is a trusted auto repair workshop in Faqir Wali offering car painting, denting, engine repair, mechanical work, detailing and spare parts."
    />
    <meta name="twitter:image" content="https://amingarage.com/favicon.png" />

    <meta name="geo.region" content="PK-PB" />
    <meta name="geo.placename" content="Faqir Wali" />
    <meta name="ICBM" content="29.482791875211284, 73.0411948755323" />

    <meta name="theme-color" content="#dc2626" />

    <!-- Desktop + Mobile Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="icon" sizes="192x192" href="/favicon.png" />
  </head>
